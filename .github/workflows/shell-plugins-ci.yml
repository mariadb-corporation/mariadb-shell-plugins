name: Shell Plugins CI

on:
  push:
    branches: [ test-workflow ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_all_tests:
        description: 'Run every plugin test suite, ignoring which files changed'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: self-linux-x64

    env:
        MYSQL_PORT: 3312

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need history so we can diff against the previous commit / PR base.
          fetch-depth: 0

      - name: Add MariaDB Server to PATH
        run: |
          MARIADB_BIN=$(echo ~/.cache/ci/mariadb*/bin)
          MARIADB_SERVER_VERSION=$($MARIADB_BIN/mariadbd --version')
          echo "MariaDB Server Version: $MARIADB_SERVER_VERSION"
          echo "$MARIADB_BIN" >> $GITHUB_PATH

      - name: Extract and add MariaDB Shell to PATH
        run: |
          tar -xzf ~/.cache/ci/mariadb-shell-*.tar.gz -C $GITHUB_WORKSPACE
          MARIADB_SHELL_BIN=$(echo $GITHUB_WORKSPACE/mariadb-shell-*/bin)
          MARIADB_SHELL_VERSION=$($MARIADB_SHELL_BIN/mariadb-shell --version')
          echo "MariaDB Shell Version: $MARIADB_SHELL_VERSION"
          echo "$MARIADB_SHELL_BIN" >> $GITHUB_PATH

      - name: Determine which plugins changed
        id: changes
        run: |
          set -uo pipefail

          changed=""
          run_all=false

          if [ "$FORCE_ALL_TESTS" = "true" ]; then
            echo "force_all_tests requested — running all plugin tests."
            run_all=true
          else
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              base="$PR_BASE_SHA"
            else
              base="$PUSH_BEFORE_SHA"
            fi

            # New branch, force push, or manual run: fall back to the parent commit.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse --verify --quiet HEAD~1 || true)"
            fi

            if [ -z "$base" ]; then
              echo "No usable diff base (first commit?) — running all plugin tests."
              run_all=true
            else
              echo "Diffing ${base}...HEAD"
              changed="$(git diff --name-only "${base}...HEAD")"
              echo "Changed files:"
              echo "$changed"
            fi
          fi

          for plugin in mrs_plugin msm_plugin mcp_plugin; do
            if [ "$run_all" = true ] || printf '%s\n' "$changed" | grep -q "^${plugin}/"; then
              echo "${plugin}: running tests"
              echo "${plugin}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${plugin}: unchanged -> skipping tests"
              echo "${plugin}=false" >> "$GITHUB_OUTPUT"
            fi
          done
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          FORCE_ALL_TESTS: ${{ inputs.force_all_tests }}

      - name: Setup Test Environment
        id: setup
        run: |
          # The credential-store tests need a Secret Service provider reachable on
          # a D-Bus session bus (see docs/CREDENTIAL_STORE.md, section 4). The
          # runner's service environment has neither, so start both here and
          # publish the bus address to the rest of the job; without them the
          # secret-service helper reports as <invalid>.
          for tool in gnome-keyring-daemon secret-tool dbus-send; do
            command -v "$tool" >/dev/null ||
              { echo "$tool not found: install gnome-keyring, libsecret-tools and dbus-bin"; exit 1; }
          done

          # Keep the keyring in its own data dir: the runner shares $HOME with
          # real logins, and an existing login.keyring with another password
          # would refuse to unlock.
          #
          # This must happen *before* the bus is forked. dbus-daemon hands its own
          # environment to every service it activates, so a daemon started by
          # D-Bus activation (see below) inherits the environment as it is at fork
          # time -- exporting this afterwards would leave that daemon looking in
          # the real $HOME. Only daemons need the variable, so it is not published
          # to $GITHUB_ENV.
          export XDG_DATA_HOME="$RUNNER_TEMP/keyring-home"
          rm -rf "$XDG_DATA_HOME"
          mkdir -p "$XDG_DATA_HOME/keyrings"

          # dbus-daemon is in the base dbus package (a gnome-keyring dependency);
          # dbus-launch needs dbus-x11, which is often absent. Both --print-*
          # options need the =FD form -- the bare form takes the *next* argument
          # as its descriptor. The PID goes to fd 3 to keep stdout to the address.
          if command -v dbus-daemon >/dev/null; then
            pid_file="$(mktemp)"
            DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --fork \
              --print-address=1 --print-pid=3 3>"$pid_file")"
            export DBUS_SESSION_BUS_ADDRESS
            dbus_pid="$(cat "$pid_file")"
            rm -f "$pid_file"
          elif command -v dbus-launch >/dev/null; then
            eval "$(dbus-launch --sh-syntax)"
            dbus_pid="$DBUS_SESSION_BUS_PID"
          else
            echo "no session bus launcher found: install dbus (dbus-daemon) or dbus-x11 (dbus-launch)"
            exit 1
          fi
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "dbus_pid=$dbus_pid" >> $GITHUB_OUTPUT

          # --unlock reads one password line from stdin and creates the login
          # keyring when it is missing -- the same path PAM uses at login. That
          # keyring is the default collection secret-tool stores into, so
          # without it every store fails with "Object does not exist at path
          # /org/freedesktop/secrets/collection/login". The password must be
          # non-empty and newline-terminated. D-Bus activation alone would
          # instead start the daemon with a locked keyring and no way to prompt.
          #
          # --replace is not optional. gnome-keyring ships a D-Bus activation file
          # for org.freedesktop.secrets, so the first secret-tool call below
          # activates a *second* daemon -- one that never received this password.
          # Whichever instance claims the name first keeps it: when the activated
          # one wins, this daemon logs "another secret service is running", stops
          # serving secrets, and every store for the rest of the job fails against
          # the collection-less activated daemon. --replace takes the name back.
          # It works by displacing the other daemon through the control socket in
          # $XDG_RUNTIME_DIR/keyring, so do not pass --control-directory: a private
          # control dir makes the other daemon undiscoverable and silently turns
          # --replace back into "another secret service is running".
          #
          # Keep the daemon's output: that message is the only trace of a lost race.
          keyring_log="$RUNNER_TEMP/gnome-keyring.log"
          printf 'ci\n' | gnome-keyring-daemon --unlock --replace --components=secrets --foreground >"$keyring_log" 2>&1 &
          keyring_pid=$!
          echo "keyring_pid=$keyring_pid" >> $GITHUB_OUTPUT

          # Wait until *this* daemon owns org.freedesktop.secrets before storing
          # anything. Neither a live daemon nor an existing login.keyring proves
          # it: both hold while the activated daemon still owns the name, and the
          # store loop below cannot recover from that -- it only ever talks to the
          # owner. Ask the bus who the owner is instead.
          secrets_owner_pid() {
            local owner
            owner="$(dbus-send --session --dest=org.freedesktop.DBus --print-reply=literal \
              /org/freedesktop/DBus org.freedesktop.DBus.GetNameOwner \
              string:org.freedesktop.secrets 2>/dev/null | tr -d '[:space:]')"
            [ -n "$owner" ] || return 0
            dbus-send --session --dest=org.freedesktop.DBus --print-reply=literal \
              /org/freedesktop/DBus org.freedesktop.DBus.GetConnectionUnixProcessID \
              string:"$owner" 2>/dev/null | awk 'END{print $NF}'
          }
          for _ in $(seq 1 40); do
            if ! kill -0 "$keyring_pid" 2>/dev/null; then
              echo "gnome-keyring-daemon exited during startup:"
              cat "$keyring_log"
              exit 1
            fi
            if [ "$(secrets_owner_pid)" = "$keyring_pid" ] &&
               [ -s "$XDG_DATA_HOME/keyrings/login.keyring" ]; then
              owned=1
              break
            fi
            sleep 0.25
          done
          if [ -z "$owned" ]; then
            echo "gnome-keyring-daemon did not take over org.freedesktop.secrets"
            echo "(owner pid $(secrets_owner_pid), ours $keyring_pid). Daemon log:"
            cat "$keyring_log"
            exit 1
          fi

          # Probe with a real store round-trip: `secret-tool search` succeeds
          # even when the default collection is missing, so it cannot tell a
          # working keyring from an unusable one.
          for _ in $(seq 1 20); do
            if printf 'probe\n' | secret-tool store --label=ci-probe ci-probe 1 >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ -z "$ready" ]; then
            echo "Secret Service did not become usable. Last attempt:"
            printf 'probe\n' | secret-tool store --label=ci-probe ci-probe 1 || true
            echo "Daemon log:"
            cat "$keyring_log"
            exit 1
          fi
          secret-tool clear ci-probe 1 >/dev/null 2>&1 || true          

      - name: Run mrs_plugin tests
        if: steps.changes.outputs.mrs_plugin == 'true'
        run: |
          cd mrs_plugin && msh --py -f run_tests.py
        shell: bash

      - name: Run msm_plugin tests
        if: steps.changes.outputs.msm_plugin == 'true'
        run: |
          cd msm_plugin && msh --py -f run_tests.py
        shell: bash

      - name: Run mcp_plugin tests
        if: steps.changes.outputs.mcp_plugin == 'true'
        run: |
          cd mcp_plugin && msh --py -f run_tests.py
        shell: bash

      - name: Teardown Secret Service
        if: always() && steps.setup.outputs.dbus_pid != ''
        run: |
          echo "Stopping keyring and D-Bus session..."
          for pid in "${{ steps.setup.outputs.keyring_pid }}" "${{ steps.setup.outputs.dbus_pid }}"; do
            [ -n "$pid" ] && kill "$pid" 2>/dev/null || true
          done
