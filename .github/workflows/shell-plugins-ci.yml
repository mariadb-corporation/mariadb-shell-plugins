name: Shell Plugins CI

on:
  push:
    branches: [ test-workflow ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_all_tests:
        description: 'Run every suite, ignoring which files changed'
        type: boolean
        required: false
        default: false

jobs:
  ensure-runner:
      uses: ./.github/workflows/devtools-ci-start.yml
      secrets: inherit

  # Which parts of the repo were touched, answered ONCE. It is its own job
  # because two jobs need the answer and they run on different footing: the
  # plugin suites want a MariaDB server and shell, the extension wants Node and
  # neither of those. Nothing here is worth doing twice, and a second copy of
  # the diff logic would be a second thing to keep in step.
  changes:
    name: Determine what changed
    needs: ensure-runner
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    outputs:
      mrs_plugin: ${{ steps.changes.outputs.mrs_plugin }}
      msm_plugin: ${{ steps.changes.outputs.msm_plugin }}
      mcp_plugin: ${{ steps.changes.outputs.mcp_plugin }}
      code_ext: ${{ steps.changes.outputs.code_ext }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need history so we can diff against the previous commit / PR base.
          fetch-depth: 0

      - name: Determine which plugins changed
        id: changes
        run: |
          set -uo pipefail

          changed=""
          run_all=false

          if [ "$FORCE_ALL_TESTS" = "true" ]; then
            echo "force_all_tests requested — running every suite."
            run_all=true
          else
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              base="$PR_BASE_SHA"
            else
              base="$PUSH_BEFORE_SHA"
            fi

            # New branch, force push, or manual run: fall back to the parent commit.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse --verify --quiet HEAD~1 || true)"
            fi

            if [ -z "$base" ]; then
              echo "No usable diff base (first commit?) — running every suite."
              run_all=true
            else
              echo "Diffing ${base}...HEAD"
              changed="$(git diff --name-only "${base}...HEAD")"
              echo "Changed files:"
              echo "$changed"
            fi
          fi

          for part in mrs_plugin msm_plugin mcp_plugin code_ext; do
            if [ "$run_all" = true ] || printf '%s\n' "$changed" | grep -q "^${part}/"; then
              echo "${part}: running tests"
              echo "${part}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${part}: unchanged -> skipping tests"
              echo "${part}=false" >> "$GITHUB_OUTPUT"
            fi
          done
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          FORCE_ALL_TESTS: ${{ inputs.force_all_tests || 'false' }}

  build:
    name: Shell-Plugins-CI-Verification
    needs: [ ensure-runner, changes ]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    # Nothing to verify when no plugin was touched; the server and shell setup
    # below is pure cost then.
    if: >-
      needs.changes.outputs.mrs_plugin == 'true'
      || needs.changes.outputs.msm_plugin == 'true'
      || needs.changes.outputs.mcp_plugin == 'true'

    env:
        MYSQL_PORT: 3312

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MariaDB Server to PATH
        run: |
          MARIADB_BIN=$(echo ~/.cache/ci/mariadb*/bin)
          # mariadbd prints its own path before the version banner; drop it.
          MARIADB_SERVER_VERSION=$($MARIADB_BIN/mariadbd --version | sed 's/^.* \(Ver .*\)$/\1/')
          echo "MariaDB Server Version: $MARIADB_SERVER_VERSION"
          echo "$MARIADB_BIN" >> $GITHUB_PATH

      - name: Extract and add MariaDB Shell to PATH
        run: |
          tar -xzf ~/.cache/ci/mariadb-shell-*.tar.gz -C $GITHUB_WORKSPACE
          MARIADB_SHELL_BIN=$(echo $GITHUB_WORKSPACE/mariadb-shell-*/bin)
          # mariadb-shell prints its own path before the version banner; drop it.
          MARIADB_SHELL_VERSION=$($MARIADB_SHELL_BIN/mariadb-shell --version | sed 's/^.* \(Ver .*\)$/\1/')
          echo "MariaDB Shell Version: $MARIADB_SHELL_VERSION"
          echo "$MARIADB_SHELL_BIN" >> $GITHUB_PATH

      - name: Run mrs_plugin tests
        if: needs.changes.outputs.mrs_plugin == 'true'
        run: |
          cd mrs_plugin && msh --py -f run_tests.py
        shell: bash

      - name: Run msm_plugin tests
        if: needs.changes.outputs.msm_plugin == 'true'
        run: |
          cd msm_plugin && msh --py -f run_tests.py
        shell: bash

      - name: Run mcp_plugin tests
        if: needs.changes.outputs.mcp_plugin == 'true'
        run: |
          cd mcp_plugin && msh --py -f run_tests.py
        shell: bash

  code-ext:
    name: Code-Ext-CI-Verification
    needs: [ ensure-runner, changes ]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    if: needs.changes.outputs.code_ext == 'true'

    defaults:
      run:
        working-directory: code_ext

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The pin lives in one place, and .nvmrc is the one a contributor's
          # `nvm use` reads too - so CI and a developer machine cannot drift
          # onto different npm majors, which is what silently rewrites
          # package-lock.json.
          node-version-file: code_ext/.nvmrc
          cache: npm
          cache-dependency-path: code_ext/package-lock.json

      - name: Install dependencies
        # `npm ci`, never `npm install`: it installs exactly what the lockfile
        # says and fails instead of quietly resolving something else, and it
        # never writes the lockfile back.
        run: npm ci

      - name: Type check and lint
        run: npm run pretest

      - name: Run code_ext tests
        run: npm test

      - name: Build the extension
        # The extension ships as a bundle, so a bundling failure - an import
        # that only resolves under the test aliases, an asset that is not
        # copied - is invisible to the type check and the tests alike. This is
        # what `vscode:prepublish` runs, so packaging cannot fail on anything
        # this step passed.
        run: npm run build
