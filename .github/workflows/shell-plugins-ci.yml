name: Shell Plugins CI

on:
  push:
    branches: [ main, test-workflow ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_all_tests:
        description: 'Run every plugin test suite, ignoring which files changed'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: self-linux-x64

    env:
        MYSQL_PORT: 3312

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need history so we can diff against the previous commit / PR base.
          fetch-depth: 0

      - name: Add mariadb-13.1.0-linux-x86_64/bin to PATH
        run: |
          MARIADB_BIN=$(echo ~/.cache/ci/mariadb*/bin)
          echo "$MARIADB_BIN" >> $GITHUB_PATH

      - name: Extract and add mariadb-shell-9.7.0-linux-glibc2.39-x86-64bit.tar.gz/bin to PATH
        run: |
          tar -xzf ~/.cache/ci/mariadb-shell-*.tar.gz -C $GITHUB_WORKSPACE
          MARIADB_SHELL_BIN=$(echo $GITHUB_WORKSPACE/mariadb-shell-*/bin)
          echo "$MARIADB_SHELL_BIN" >> $GITHUB_PATH

      - name: Set up MariaDB sandbox
        id: sandbox
        run: |
          msh -- sandbox deploy $MYSQL_PORT --password=
          echo "deployed=true" >> $GITHUB_OUTPUT

      - name: Determine which plugins changed
        id: changes
        run: |
          set -uo pipefail

          changed=""
          run_all=true

          if [ "$FORCE_ALL_TESTS" = "true" ]; then
            echo "force_all_tests requested — running all plugin tests."
            run_all=true
          else
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              base="$PR_BASE_SHA"
            else
              base="$PUSH_BEFORE_SHA"
            fi

            # New branch, force push, or manual run: fall back to the parent commit.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse --verify --quiet HEAD~1 || true)"
            fi

            if [ -z "$base" ]; then
              echo "No usable diff base (first commit?) — running all plugin tests."
              run_all=true
            else
              echo "Diffing ${base}...HEAD"
              changed="$(git diff --name-only "${base}...HEAD")"
              echo "Changed files:"
              echo "$changed"
            fi
          fi

          for plugin in mrs_plugin msm_plugin mcp_plugin; do
            if [ "$run_all" = true ] || printf '%s\n' "$changed" | grep -q "^${plugin}/"; then
              echo "${plugin}: running tests"
              echo "${plugin}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${plugin}: unchanged -> skipping tests"
              echo "${plugin}=false" >> "$GITHUB_OUTPUT"
            fi
          done
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          FORCE_ALL_TESTS: ${{ inputs.force_all_tests }}

      - name: Run mrs_plugin tests
        if: steps.changes.outputs.mrs_plugin == 'true'
        run: |
          cd mrs_plugin && msh --py -f run_tests.py
        shell: bash

      - name: Run msm_plugin tests
        if: steps.changes.outputs.msm_plugin == 'true'
        run: |
          cd msm_plugin && msh --py -f run_tests.py
        shell: bash

      - name: Run mcp_plugin tests
        if: steps.changes.outputs.mcp_plugin == 'true'
        run: |
          cd mcp_plugin && msh --py -f run_tests.py
        shell: bash

      - name: Clean up MariaDB sandbox
        if: always() && steps.sandbox.outputs.deployed == 'true'
        run: |
          msh -- sandbox stop $MYSQL_PORT
          msh -- sandbox delete $MYSQL_PORT
