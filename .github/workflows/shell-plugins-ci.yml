name: Shell Plugins CI

on:
  push:
    branches: [ test-workflow ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_all_tests:
        description: 'Run every suite, ignoring which files changed'
        type: boolean
        required: false
        default: false

jobs:
  # Whether to bypass the run, as [bypass-ci] does in mariadb-shell: in a
  # PR's title, or for a push, which has no PR title, in the pushed commit's
  # message or the title of the branch's open PR - updating a PR's branch
  # pushes commits that do not carry the tag, a merge of main among them.
  # On a hosted runner, so deciding never starts the VM.
  bypass:
    name: Check for [bypass-ci]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      bypass: ${{ steps.check.outputs.bypass }}
    steps:
      - name: Look for the tag
        id: check
        run: |
          bypass=false
          if [[ "$PR_TITLE" == *"[bypass-ci]"* || "$COMMIT_MESSAGE" == *"[bypass-ci]"* ]]; then
            bypass=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # A failed lookup runs the CI rather than skipping it.
            titles="$(gh pr list -R "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" \
              --state open --json title --jq '.[].title' || true)"
            if [[ "$titles" == *"[bypass-ci]"* ]]; then
              bypass=true
            fi
          fi
          echo "bypass: $bypass"
          echo "bypass=$bypass" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

  # Skipping this job skips the two that need it, so the VM is not started
  # and Shell-Plugins-CI-Verification reports as skipped, as it does when no
  # plugin changed.
  ensure-runner:
      needs: bypass
      if: ${{ needs.bypass.outputs.bypass != 'true' }}
      uses: ./.github/workflows/devtools-ci-start.yml
      secrets: inherit

  # Which plugins were touched. It is its own job so that the verification job
  # can be skipped as a whole, server and shell setup included, when none was.
  changes:
    name: Determine what changed
    needs: ensure-runner
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    outputs:
      rest_plugin: ${{ steps.changes.outputs.rest_plugin }}
      msm_plugin: ${{ steps.changes.outputs.msm_plugin }}
      mcp_plugin: ${{ steps.changes.outputs.mcp_plugin }}
      dba_plugin: ${{ steps.changes.outputs.dba_plugin }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need history so we can diff against the previous commit / PR base.
          fetch-depth: 0

      - name: Determine which plugins changed
        id: changes
        run: |
          set -uo pipefail

          changed=""
          run_all=false

          if [ "$FORCE_ALL_TESTS" = "true" ]; then
            echo "force_all_tests requested — running every suite."
            run_all=true
          else
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              base="$PR_BASE_SHA"
            else
              base="$PUSH_BEFORE_SHA"
            fi

            # New branch, force push, or manual run: fall back to the parent commit.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse --verify --quiet HEAD~1 || true)"
            fi

            if [ -z "$base" ]; then
              echo "No usable diff base (first commit?) — running every suite."
              run_all=true
            else
              echo "Diffing ${base}...HEAD"
              changed="$(git diff --name-only "${base}...HEAD")"
              echo "Changed files:"
              echo "$changed"
            fi
          fi

          # dba_plugin is a plugin group: its core and the vendor plugins,
          # which load through the core. A change to any member runs the
          # group's one suite, which tests the core with every vendor.
          for part in rest_plugin msm_plugin mcp_plugin dba_plugin; do
            if [ "$run_all" = true ] || printf '%s\n' "$changed" | grep -q "^${part}/"; then
              echo "${part}: running tests"
              echo "${part}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${part}: unchanged -> skipping tests"
              echo "${part}=false" >> "$GITHUB_OUTPUT"
            fi
          done
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          FORCE_ALL_TESTS: ${{ inputs.force_all_tests || 'false' }}

  build:
    name: Shell-Plugins-CI-Verification
    needs: [ ensure-runner, changes ]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    # Nothing to verify when no plugin was touched; the server and shell setup
    # below is pure cost then.
    if: >-
      needs.changes.outputs.rest_plugin == 'true'
      || needs.changes.outputs.msm_plugin == 'true'
      || needs.changes.outputs.mcp_plugin == 'true'
      || needs.changes.outputs.dba_plugin == 'true'

    env:
        MYSQL_PORT: 3312

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MariaDB Server to PATH
        run: |
          MARIADB_BIN=$(echo ~/.cache/ci/mariadb*/bin)
          # mariadbd prints its own path before the version banner; drop it.
          MARIADB_SERVER_VERSION=$($MARIADB_BIN/mariadbd --version | sed 's/^.* \(Ver .*\)$/\1/')
          echo "MariaDB Server Version: $MARIADB_SERVER_VERSION"
          echo "$MARIADB_BIN" >> $GITHUB_PATH

      - name: Extract and add MariaDB Shell to PATH
        run: |
          tar -xzf ~/.cache/ci/mariadb-shell-*.tar.gz -C $GITHUB_WORKSPACE
          MARIADB_SHELL_BIN=$(echo $GITHUB_WORKSPACE/mariadb-shell-*/bin)
          # mariadb-shell prints its own path before the version banner; drop it.
          MARIADB_SHELL_VERSION=$($MARIADB_SHELL_BIN/mariadb-shell --version | sed 's/^.* \(Ver .*\)$/\1/')
          echo "MariaDB Shell Version: $MARIADB_SHELL_VERSION"
          echo "$MARIADB_SHELL_BIN" >> $GITHUB_PATH

      - name: Run rest_plugin tests
        if: needs.changes.outputs.rest_plugin == 'true'
        run: |
          cd rest_plugin && msh --py -f run_tests.py
        shell: bash

      - name: Run msm_plugin tests
        if: needs.changes.outputs.msm_plugin == 'true'
        run: |
          cd msm_plugin && msh --py -f run_tests.py
        shell: bash

      - name: Run mcp_plugin tests
        if: needs.changes.outputs.mcp_plugin == 'true'
        run: |
          cd mcp_plugin && msh --py -f run_tests.py
        shell: bash

      - name: Run dba_plugin tests
        if: needs.changes.outputs.dba_plugin == 'true'
        run: |
          cd dba_plugin/dba_core && msh --py -f run_tests.py
        shell: bash
