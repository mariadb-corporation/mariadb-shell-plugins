[pytest]
junit_family = xunit1
markers =
    live: test against a vendor's real API, with the API key from the DBA_TEST_<VENDOR>_API_KEY environment variable. Skipped unless --live is given.
addopts = --color=yes -ra --junitxml=plugin-tests.xml --cov-report term --cov-report xml:plugin-test-coverage.xml --cov-report html --cov-config=".coveragerc"
