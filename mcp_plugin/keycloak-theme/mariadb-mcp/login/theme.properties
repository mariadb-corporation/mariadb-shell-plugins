# Login theme for the MariaDB MCP realm, in the look of the MCP server's own
# sign-in page. template.ftl and login.ftl are this theme's; every other page
# comes from the base theme and is styled through the classes below.
parent=base
import=common/keycloak
styles=css/mariadb-mcp.css

kcFormGroupClass=mcpGroup
kcLabelClass=mcpLabel
kcInputClass=mcpInput
kcInputErrorMessageClass=mcpFieldError
kcButtonClass=mcpButton
kcButtonPrimaryClass=mcpButtonPrimary
kcButtonDefaultClass=
kcAlertClass=mcpAlert
kcFormPasswordVisibilityButtonClass=mcpHidden
kcFormSocialAccountListButtonClass=mcpSocialButton
